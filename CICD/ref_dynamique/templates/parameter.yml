    replace_value:
      dev: "<<ID_pl_load_object_DEV>>"
    item_type: "DataPipeline"
    item_name: "pl_load_tables"
  - find_key: '$.properties.activities[?(@.name=="pl_load_mappinggrade")].typeProperties.workspaceId'
    replace_value:
