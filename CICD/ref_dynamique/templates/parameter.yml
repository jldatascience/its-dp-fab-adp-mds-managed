# ===========================================================================
# lh_dso.Lakehouse — Raccourci (shortcut) OneLake 'storage'
# Role : fait pointer le shortcut vers le lakehouse de stockage du workspace courant.
# 2 regles. (section 2.2bis du MODOP — A VALIDER au 1er run.)
# ===========================================================================
  - find_key: '$[?(@.name=="storage")].target.oneLake.workspaceId'
    replace_value:
      dev: "<<WS_ADP_MDS_DEV>>"
    item_type: "Lakehouse"
    item_name: "lh_dso"
  - find_key: '$[?(@.name=="storage")].target.oneLake.itemId'
    replace_value:
      dev: "<<ID_lh_storage_DEV>>"
    item_type: "Lakehouse"
    item_name: "lh_dso"
