    item_type: "DataPipeline"
    item_name: "pl_load_tables"
  - find_key: '$.properties.activities[?(@.name=="pl_load_profitcenter")].typeProperties.workspaceId'
    replace_value:
      dev: "<<WS_FRAMEWORK_DEV>>"
    item_type: "DataPipeline"
    item_name: "pl_load_tables"
  - find_key: '$.properties.activities[?(@.name=="pl_load_profitcenter")].typeProperties.pipelineId'
