# CI.yml — its-dp-fab-adp-mds-managed (pipeline Azure DevOps « FabricCI »)
# Template KPMG « Plateforme Technologique/CICD » CONSERVÉ : versioning, SonarQube,
# publication de l'artefact « fabric » (consommé par CD.yml).
# Changements : déclencheurs develop, release/* et main au lieu de la branche feature
# (v1.2 : develop → ITG, release/* → PPR, main → PRD) ;
# la validation de PR est portée par PR-Validation.yml (check GitHub obligatoire).
# ADP MDS : aligné sur le template KPMG (l'ancienne CI ne contrôlait rien : echo).
# Projet SonarQube à créer / confirmer avec Plateforme Technologique.
# À vérifier (V-01) : le filtre « contents: !/*.json » ne doit pas exclure les fichiers
# d'items ; la CD échoue explicitement (STRUCT_NO_ITEMS) si l'artefact est incomplet.
# ── trigger — branches qui declenchent le build (develop / release/* / main, v1.2)
trigger:
  branches:
    include:
      - develop
      - release/*
      - main
# ── pr — la validation de PR est portee par PR-Validation.yml
pr: none

# ── pool — image d'agent de build
pool:
  vmImage: "ubuntu-24.04"

# ── resources — template KPMG 'Plateforme Technologique/CICD' conserve
resources:
  repositories:
    - repository: CICD
      name: "Plateforme Technologique/CICD"
      type: git
      ref: "refs/heads/main"

# ── extends — etend le template CI KPMG (versioning, SonarQube, artefact 'fabric')
extends:
  template: PipelineTemplate.yaml@CICD
  parameters:
    versioning:
      mode: legacy
      major: 1
      minor: 0
    build:
      sonarQube:
        projectKey: Discovery_DP-FAB-ADP-MDS-Managed
        projectName: "[Discovery] DP FAB ADP MDS Managed"
        qualityGateName: "[Discovery] Starter"
      steps:
        - type: files
          name: fabric
          path: ./
          contents: "!/*.json"
