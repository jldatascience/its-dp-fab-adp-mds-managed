# CICD/deployment/parameter.yml — its-dp-fab-adp-mds-managed
# Source : MODOP CI/CD sections 2.2 et 2.2bis (7 références sandbox + 1 référence ADP MDS DEV
# dans pl_master_load + 1 shortcut lh_dso).
# Les pipelines du Framework sont résolus PAR NOM dans le workspace Framework de
# l'environnement cible (syntaxe fabric-cicd 1.4.0 vérifiée :
# $workspace.<nom>.$items.<type>.<nom>.$id). Absent = échec explicite au pré-vol.
# Clés d'environnement en MAJUSCULES (fabric-cicd compare la casse).
# Points à confirmer (MODOP) : pl_sequence_start -> log_sequence_start (hypothèse) ;
# noms exacts des workspaces Framework PPR/PRD ; lh_storage = cible du shortcut storage.
key_value_replace:
  # [1/7] pl_master_load / activité pl_get_ws_lh_ids -> Framework DataPipeline pl_get_ws_lh_ids
  - find_key: $.properties.activities[?(@.name=="pl_get_ws_lh_ids")].typeProperties.workspaceId
    replace_value:
      DEV: "$workspace.FR - DP - DEV - FAB - Framework - MANAGED.$id"
      ITG: "$workspace.FR - DP - ITG - FAB - Framework - MANAGED.$id"
      PPR: "$workspace.FR - DP - PPR - FAB - Framework - MANAGED.$id"
      PRD: "$workspace.FR - DP - PRD - FAB - Framework - MANAGED.$id"
    item_type: DataPipeline
    item_name: pl_master_load
  - find_key: $.properties.activities[?(@.name=="pl_get_ws_lh_ids")].typeProperties.pipelineId
    replace_value:
      DEV: "$workspace.FR - DP - DEV - FAB - Framework - MANAGED.$items.DataPipeline.pl_get_ws_lh_ids.$id"
      ITG: "$workspace.FR - DP - ITG - FAB - Framework - MANAGED.$items.DataPipeline.pl_get_ws_lh_ids.$id"
      PPR: "$workspace.FR - DP - PPR - FAB - Framework - MANAGED.$items.DataPipeline.pl_get_ws_lh_ids.$id"
      PRD: "$workspace.FR - DP - PRD - FAB - Framework - MANAGED.$items.DataPipeline.pl_get_ws_lh_ids.$id"
    item_type: DataPipeline
    item_name: pl_master_load
